<div class="min-h-screen flex items-center justify-center bg-slate-50 p-4">
  <div class="w-full max-w-md bg-white p-8 rounded-3xl shadow-2xl border border-slate-100">
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <i class="pi pi-key text-3xl text-blue-600"></i>
      </div>
      <h2 class="text-3xl font-extrabold text-slate-800">{{ 'RESET_PASSWORD.TITLE' | translate }}</h2>
    </div>

    @if (!token) {
      <p-message severity="danger" [text]="'RESET_PASSWORD.ERROR_INVALID_TOKEN' | translate" styleClass="w-full"></p-message>
      <div class="text-center mt-6"><a routerLink="/login" class="text-blue-600 font-bold hover:underline">{{ 'RESET_PASSWORD.BTN_RETURN_LOGIN' | translate }}</a></div>
    } @else if (successMessage) {
      <div class="bg-green-50 p-6 rounded-xl border border-green-200 text-center">
        <i class="pi pi-check-circle text-4xl text-green-500 mb-2"></i>
        <h3 class="text-lg font-bold text-green-800 mb-1">{{ 'RESET_PASSWORD.SUCCESS_TITLE' | translate }}</h3>
        <p class="text-green-700 text-sm">{{ 'RESET_PASSWORD.SUCCESS_DESC' | translate }}</p>
      </div>
    } @else {
      @if (errorMessage) {
        <p-message severity="danger" [text]="errorMessage" styleClass="w-full mb-4"></p-message>
      }
      <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-6">
        <div class="flex flex-col gap-2">
          <label class="font-bold text-slate-700">{{ 'RESET_PASSWORD.LAB_NEW_PASSWORD' | translate }}</label>
          <p-password formControlName="password" [toggleMask]="true" [placeholder]="'RESET_PASSWORD.PLACEHOLDER_PASSWORD' | translate" styleClass="w-full" inputStyleClass="w-full p-4 rounded-xl border-slate-200 focus:ring-blue-500 bg-slate-50"></p-password>
        </div>
        <p-button [label]="'RESET_PASSWORD.BTN_SUBMIT' | translate" type="submit" [disabled]="resetForm.invalid" [loading]="isLoading" styleClass="w-full p-4 text-lg font-bold bg-blue-600 border-none hover:bg-blue-700 shadow-md shadow-blue-500/30"></p-button>
      </form>
    }
  </div>
</div>
