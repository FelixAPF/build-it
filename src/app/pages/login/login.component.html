<div class="min-h-screen flex items-center justify-center bg-slate-50 p-4">
  <div class="w-full max-w-md">
    
    <div class="text-center mb-8">
      <h1 class="text-4xl font-extrabold text-blue-600 mb-2">BuildIt</h1>
      <p class="text-slate-500">Welcome back! Please login to your account.</p>
    </div>

    <p-card styleClass="shadow-lg rounded-xl">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
        
        @if(errorMessage) {
          <p-message severity="danger" [text]="errorMessage" styleClass="w-full"></p-message>
        }

        <div class="flex flex-col gap-2">
          <label htmlFor="email" class="font-semibold text-slate-700">Email</label>
          <input pInputText id="email" formControlName="email" type="email" placeholder="name@company.com" class="w-full p-3" />
        </div>

        <div class="flex flex-col gap-2">
          <label htmlFor="password" class="font-semibold text-slate-700">Password</label>
          <input pInputText id="password" formControlName="password" type="password" placeholder="••••••••" class="w-full p-3" />
        </div>

        <p-button 
          label="Login" 
          type="submit" 
          [disabled]="loginForm.invalid" 
          [loading]="isLoading"
          styleClass="w-full mt-4 p-3 bg-blue-600 border-none hover:bg-blue-700 transition-colors">
        </p-button>

        <div class="text-center mt-4 text-sm text-slate-500">
          Don't have an account? 
          <a routerLink="/register" class="text-blue-600 font-semibold hover:underline">Register here</a>
        </div>
      </form>
    </p-card>
  </div>
</div>
