<div class="min-h-screen relative flex items-center justify-center bg-slate-50 overflow-hidden p-4 sm:p-8">
  
  <!-- Decorative Background Glows -->
  <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-blue-400/20 rounded-full blur-[100px] pointer-events-none -z-10"></div>
  <div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-indigo-400/20 rounded-full blur-[100px] pointer-events-none -z-10"></div>

  <div class="w-full max-w-md z-10 animate-fade-in">
    
    <!-- Header & Logo -->
    <div class="text-center mb-8 flex flex-col items-center">
      <a routerLink="/" class="w-16 h-16 bg-gradient-to-br from-blue-600 to-indigo-600 rounded-2xl flex items-center justify-center shadow-xl shadow-blue-500/30 mb-5 hover:scale-105 transition-transform">
        <i class="pi pi-building text-white text-3xl font-bold"></i>
      </a>
      <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-800 tracking-tight">Welcome back</h1>
      <p class="text-slate-500 mt-2 text-lg">Log in to your BuildIt account</p>
    </div>

    <!-- Glassmorphic Card -->
    <div class="bg-white/80 backdrop-blur-xl border border-white shadow-2xl shadow-slate-200/50 rounded-[2rem] p-6 sm:p-10">
      
      @if(errorMessage) {
        <p-message severity="danger" [text]="errorMessage" styleClass="w-full mb-6 block"></p-message>
      }

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-6">
        
        <div class="flex flex-col gap-2">
          <label class="font-bold text-slate-700">Email Address</label>
          <input pInputText formControlName="email" type="email" placeholder="name@company.com" class="w-full p-4 rounded-xl border-slate-200 focus:ring-blue-500 bg-white/50 focus:bg-white transition-colors" />
          <div class="text-right -mt-4">
            <a href="#" (click)="$event.preventDefault(); showForgotDialog = true" class="text-sm text-blue-600 font-semibold hover:underline">Forgot password?</a>
          </div>
        </div>

        <div class="flex flex-col gap-2">
          <label class="font-bold text-slate-700">Password</label>
          <p-password formControlName="password" [toggleMask]="true" placeholder="••••••••" styleClass="w-full" inputStyleClass="w-full p-4 rounded-xl border-slate-200 focus:ring-blue-500 bg-white/50 focus:bg-white transition-colors" [feedback]="false"></p-password>
        </div>

        <p-button label="Sign In" type="submit" [disabled]="loginForm.invalid" [loading]="isLoading" styleClass="w-full mt-2 p-4 text-lg font-bold bg-gradient-to-r from-blue-600 to-indigo-600 border-none hover:from-blue-700 hover:to-indigo-700 shadow-lg shadow-blue-600/20 transition-all"></p-button>
      </form>

      <div class="text-center mt-8 text-sm text-slate-500 font-medium border-t border-slate-100 pt-6">
        Don't have an account yet?
        <a routerLink="/register" class="text-blue-600 font-bold hover:text-blue-700 hover:underline transition-colors ml-1">Create one now</a>
      </div>
    </div>
    
  </div>
</div>

<p-toast></p-toast>
<p-dialog header="Reset Password" [(visible)]="showForgotDialog" [modal]="true" [dismissableMask]="true" [style]="{width: '100%', maxWidth: '28rem'}" [breakpoints]="{'640px': '90vw'}">
  <p class="text-slate-500 mb-4">Enter the email associated with your account, and we'll send you a magic link to reset your password.</p>
  <div class="flex flex-col gap-2">
    <input pInputText [(ngModel)]="forgotEmail" placeholder="name@company.com" class="w-full p-3 rounded-xl border-slate-300" />
  </div>
  <div class="flex justify-end gap-2 mt-6">
    <p-button label="Cancel" styleClass="p-button-text" (onClick)="showForgotDialog = false"></p-button>
    <p-button label="Send Link" [loading]="isSendingReset" styleClass="p-button-info" (onClick)="submitForgotPassword()"></p-button>
  </div>
</p-dialog>
