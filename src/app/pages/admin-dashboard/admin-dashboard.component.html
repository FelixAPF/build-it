<p-toast></p-toast>
<div class="min-h-screen bg-slate-900 p-8">
  <div class="max-w-7xl mx-auto">
    
    <div class="flex justify-between items-center mb-8">
      <div>
        <h1 class="text-4xl font-extrabold text-white">Admin Control Center</h1>
        <p class="text-slate-400 mt-2">Verify CCQ & RBQ licenses before activating accounts.</p>
      </div>
      <p-button label="Logout" icon="pi pi-sign-out" styleClass="p-button-danger" (onClick)="logout()"></p-button>
    </div>

    <div class="bg-white rounded-xl shadow-sm overflow-hidden">
      <p-table [value]="pendingUsers" [loading]="isLoading" [rows]="10" [paginator]="true">
        <ng-template pTemplate="header">
          <tr>
            <th>Date Registered</th>
            <th>Type</th>
            <th>Name / Company</th>
            <th>Email</th>
            <th>CCQ / RBQ Number</th>
            <th class="text-center">Action</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-user>
          <tr>
            <td class="text-sm text-slate-500">{{user.createdAt | date:'medium'}}</td>
            <td>
              <p-tag [value]="user.role" [severity]="user.role === 'WORKER' ? 'info' : 'warning'"></p-tag>
            </td>
            <td class="font-bold text-slate-800">{{user.name}}</td>
            <td>{{user.email}}</td>
            <td class="font-mono text-slate-600 bg-slate-100 px-2 py-1 rounded inline-block">{{user.identificationNumber}}</td>
            <td class="text-center">
              <p-button label="Verify & Activate" icon="pi pi-check-circle" styleClass="p-button-success p-button-sm" (onClick)="verifyUser(user.userId)"></p-button>
            </td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr><td colspan="6" class="text-center p-8 text-slate-500">All users are verified! Inbox zero.</td></tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>
